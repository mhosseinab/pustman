# Pustman workspace. Every version and feature set is declared once here; crates inherit it
# with `dep.workspace = true`. See .agents/skills/pustman-feature-crate/SKILL.md.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# Build-time only: embeds the Windows app icon resource (crates/pustman/build.rs).
embed-resource = "3.0.12"

#
# Workspace member crates
#

api_model = { path = "crates/api_model" }
variables = { path = "crates/variables" }
workspace_store = { path = "crates/workspace_store" }
storage = { path = "crates/storage" }
secrets = { path = "crates/secrets" }
http_engine = { path = "crates/http_engine" }
settings = { path = "crates/settings" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
text_input = { path = "crates/text_input" }
pustman_actions = { path = "crates/pustman_actions" }
workspace = { path = "crates/workspace" }
command_palette = { path = "crates/command_palette" }
request_editor = { path = "crates/request_editor" }
response_viewer = { path = "crates/response_viewer" }
console = { path = "crates/console" }
environment_picker = { path = "crates/environment_picker" }
history_panel = { path = "crates/history_panel" }
collections_panel = { path = "crates/collections_panel" }
git = { path = "crates/git" }
websocket_client = { path = "crates/websocket_client" }
grpc_client = { path = "crates/grpc_client" }

#
# GPUI, pinned to one Zed revision. All three must share the rev: mixed revs compile
# two gpuis and fail with confusing type mismatches.
#

gpui = { git = "https://github.com/zed-industries/zed", rev = "0cc1ffb6b324165ec173a016c5548520c1eeb7ec" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "0cc1ffb6b324165ec173a016c5548520c1eeb7ec", features = ["font-kit", "wayland", "x11"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "0cc1ffb6b324165ec173a016c5548520c1eeb7ec" }

#
# Third-party
#

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
cookie_store = "0.22.1"
futures = "0.3.34"
hex = "0.4.3"
# PNG only: decodes the bundled app icon for the X11 window (`pustman::app_icon`).
image = { version = "0.25.10", default-features = false, features = ["png"] }
indexmap = { version = "2.14.2", features = ["serde"] }
keyring = "4.2.0"
log = "0.4.35"
mime = "0.3.18"
mime_guess = "2.0.5"
notify = "8.2.2"
percent-encoding = "2.3.2"
publicsuffix = "2.3.0"
rand = "0.10.4"
regex = "1.13.1"
# `socks`: SOCKS4/5 proxies (M3 proxy settings).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "stream", "gzip", "brotli", "deflate", "multipart", "json", "socks"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
shlex = "2.0.1"
similar = "3.2.1"
smol = "2.0.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "serde"] }
ulid = { version = "3.0.0", features = ["serde"] }
unicode-segmentation = "1.13.3"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4"] }

#
# M3–M5 protocols. TLS everywhere is rustls 0.23 with the aws-lc-rs provider reqwest uses;
# `websocket_client::tls_provider` and `grpc_client::tls_provider` install it once.
#

# Auth (M3). `http-auth` parses Digest challenges and answers them (MD5, SHA-256);
# `hmac` stays on the RustCrypto digest 0.10 line that `sha2` (above) is on.
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.6"
hmac = "0.12.1"
http-auth = { version = "0.1.10", default-features = false, features = ["digest-scheme"] }
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
# PFX/PKCS#12 → PEM: reqwest's rustls backend takes PEM identities only.
p12-keystore = "0.4.1"
# WebSocket and Socket.IO (M4). `socketio-next` speaks Engine.IO 4 / Socket.IO protocol 5
# (socket.io v3 and v4 servers) and takes our own rustls `ClientConfig`.
socketio-next = { version = "0.2.1", default-features = false, features = ["rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# gRPC (M5): descriptors compiled at runtime by `protox`, messages handled as
# `prost-reflect` dynamic messages (proto3 JSON through `serde`). No build.rs, no protoc.
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.6"
protox = "0.10.0"
tonic = { version = "0.14.9", features = ["tls-aws-lc", "tls-native-roots"] }
tonic-reflection = "0.14.9"
tonic-types = "0.14.9"

#
# Dev and test only
#

bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = "0.1.21"
pretty_assertions = "1.4.1"
rcgen = "0.14.10"
# The in-process Socket.IO server the M4 tests talk to.
socketioxide = "0.18.9"
rustls = "0.23.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-rustls = "0.26.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Full DWARF made each GPUI test binary ~420 MB and one worktree's target/ 24 GB.
# Line tables keep file:line in panics and backtraces at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
