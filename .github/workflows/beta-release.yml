name: Beta release

# Builds the desktop app for Linux and macOS for a beta tag (`v*-beta*`) and publishes the
# packages as a GitHub pre-release. Push the tag, or create the pre-release in the UI: either
# works, because the publish job creates the release when it does not exist yet and only
# uploads when it does. Promotions (release/pustman-v1-<n>) stay a manual, human-smoked
# process.

on:
  push:
    tags: ['v*-beta*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: beta-${{ github.event.release.tag_name || github.ref_name }}

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  package:
    if: github.event_name == 'push' || github.event.release.prerelease
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          # Experimental: never built before this workflow; a failure here does not stop
          # the Linux and macOS packages from being published.
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libdbus-1-dev

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Restores the release build warmed on the default branch (release-cache.yml); tag
      # builds can only read caches from their own tag and the default branch, so they
      # never save one themselves.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Build release
        run: cargo build --release --locked -p pustman

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="pustman-${TAG}-linux-x86_64"
          stage="dist/$name"
          mkdir -p "$stage/scripts" "$stage/assets/pustman-icon-pack"
          cp target/release/pustman "$stage/pustman"
          cp scripts/install-desktop-entry.sh "$stage/scripts/"
          cp -R assets/pustman-icon-pack/linux "$stage/assets/pustman-icon-pack/"
          cat > "$stage/README.txt" <<'EOF'
          Pustman beta for Linux (x86_64)

          Run:      ./pustman
          Install the launcher entry and icon (optional):
                    scripts/install-desktop-entry.sh ./pustman

          Needs the usual GPUI desktop libraries: xkbcommon, wayland or X11, vulkan,
          fontconfig, freetype. This is a beta: expect rough edges.
          EOF
          mkdir -p out
          tar -C dist -czf "out/$name.tar.gz" "$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          scripts/bundle-macos.sh target/release/pustman dist
          mkdir -p out
          name="pustman-${TAG}-macos-arm64"
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            # No Developer ID secrets: ship the ad-hoc signed app (Gatekeeper asks once).
            echo "::notice::Developer ID secrets not set; shipping the ad-hoc signed zip"
            ditto -c -k --keepParent dist/Pustman.app "out/$name.zip"
            exit 0
          fi
          scripts/sign-notarize-macos.sh dist/Pustman.app "out/$name.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "pustman-$env:TAG-windows-x86_64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage, out | Out-Null
          Copy-Item target/release/pustman.exe "$stage/pustman.exe"
          "Pustman beta for Windows (x86_64)`r`n`r`nRun pustman.exe. The executable is not signed, so Windows SmartScreen may warn the first time.`r`nThis is a beta: expect rough edges." | Set-Content "$stage/README.txt"
          Compress-Archive -Path $stage -DestinationPath "out/$name.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: package
    # Publish whatever platforms packaged: one failing build (Windows is experimental)
    # must not hold back the others. The step fails if nothing was packaged at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: out
          merge-multiple: true

      - name: Create the pre-release if it does not exist, then attach the packages
        run: |
          if ! ls out/* >/dev/null 2>&1; then
            echo "no platform packaged; nothing to publish" >&2
            exit 1
          fi
          notes="docs/releases/${TAG}.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$TAG" --verify-tag --prerelease --title "Pustman $TAG" --notes-file "$notes"
            else
              gh release create "$TAG" --verify-tag --prerelease --title "Pustman $TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" out/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
