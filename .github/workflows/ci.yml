name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libdbus-1-dev

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Saves on every default-branch run (a fixed key on actions/cache never refreshed,
      # so the cached build went stale as the code moved); other refs restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          # Save even when a test fails: a cold build writes GBs of output right before the
          # tests, macOS then drops file events and the watcher tests see a Rescan, so a
          # cache lost on failure keeps every following macOS run cold and failing.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/pustman-v1/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Verify
        run: scripts/pustman-v1-verify.sh
