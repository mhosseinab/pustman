# crates/settings — typed app settings: bundled defaults merged with the user file, held
# as a GPUI global that the rest of the app reads typed views from. Still pure parse and
# merge over JSON text: no IO, no file watching — callers pass the user blob in.

[package]
name = "settings"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/settings.rs"

[dependencies]
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
