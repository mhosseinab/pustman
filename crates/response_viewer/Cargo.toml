# crates/response_viewer — what a send comes back with, on screen: the status line
# (REQ-RESP-01), the headers table (REQ-RESP-05) and the body (REQ-RESP-02). S29a lands
# Raw mode; Pretty mode, the error panel and the remaining tabs follow in later steps.

[package]
name = "response_viewer"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/response_viewer.rs"

[dependencies]
anyhow.workspace = true
api_model.workspace = true
# `session_store` streams a spilled binary payload into its JSONL export as base64.
base64.workspace = true
cookie_store.workspace = true
gpui.workspace = true
hex.workspace = true
http_engine.workspace = true
mime.workspace = true
pustman_actions.workspace = true
regex.workspace = true
# `session_store` streams a spilled payload into a JSONL line through a `Serialize` impl.
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
storage.workspace = true
text_input.workspace = true
theme.workspace = true
# `parsing` is declared here, not borrowed from feature unification: `cookie_form`
# parses RFC 2822 expiry text (`OffsetDateTime::parse`) and must compile on its own.
time = { workspace = true, features = ["parsing"] }
ui.workspace = true
# The Resend re-check runs `http_engine::prepare` — the send's own resolution — whose
# `DynamicValues` is one re-check's own (REQ-VAR-05's shape).
variables.workspace = true
workspace.workspace = true

[dev-dependencies]
# The tests drive the real variables editor through `environment::EditSecret` and read
# its rows; the production code coordinates with it through that action only
# (ARCHITECTURE.md: "anything else coordinates through `workspace`"). Cargo allows a
# cycle that runs through a dev-dependency.
environment_picker.workspace = true
gpui = { workspace = true, features = ["test-support"] }
image.workspace = true
# The request-as-sent tests derive auto headers through a dry `http_engine::prepare`,
# the narrowest public API that fills `ResolvedRequest::auto_headers` (the
# `request_editor::headers` precedent): the store holds nothing and nothing resolves.
secrets = { workspace = true, features = ["test-support"] }
# The large-body test builds a `ResponseBody::Spilled` through `http_engine::SpillWriter`,
# whose pushes are tokio futures (its temp file is `tokio::fs`); the test drives them on
# a tokio runtime of its own.
tokio.workspace = true
tempfile.workspace = true
ui = { workspace = true, features = ["test-support"] }
url.workspace = true
# The set-secret test builds the variables editor's inputs from a real workspace item
# (`EditTarget::new`), the shape `workspace_store::open` hands the app.
workspace_store.workspace = true
