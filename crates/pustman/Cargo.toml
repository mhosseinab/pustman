# crates/pustman — the app: the library holding the init order (`src/pustman.rs`) and the
# thin window opener (`src/main.rs`). Every UI crate plugs into `pustman::init`; later wire
# steps append one line per crate there (docs/pustman-v1-implementation-steps.md, S22e).

[package]
name = "pustman"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/pustman.rs"

[[bin]]
name = "pustman"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
command_palette.workspace = true
console.workspace = true
environment_picker.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
history_panel.workspace = true
http_engine.workspace = true
image.workspace = true
pustman_actions.workspace = true
request_editor.workspace = true
response_viewer.workspace = true
secrets.workspace = true
settings.workspace = true
storage.workspace = true
text_input.workspace = true
theme.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
api_model.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# Enabling `test-support` is what makes `FakeTransport` and `MemorySecretStore` visible
# to this crate's tests: dev-dependencies unify features with the test build.
http_engine = { workspace = true, features = ["test-support"] }
secrets = { workspace = true, features = ["test-support"] }
ui = { workspace = true, features = ["test-support"] }
variables.workspace = true
