# Pustman's per-user local store (ADR-0002: rusqlite, bundled SQLite). Domain crate:
# no gpui, no UI, no threads — callers run it off the foreground thread.

[package]
name = "storage"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/storage.rs"

[dependencies]
rusqlite.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
tempfile.workspace = true
