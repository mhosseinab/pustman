# crates/integration_tests — end-to-end proofs that cross crate boundaries: one scenario
# driven through the real crates, asserting the guarantees no single crate's tests can
# see (S37's redaction NFR first). Dev-only: the library target is a doc comment and the
# proofs live in `tests/`.

[package]
name = "integration_tests"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/integration_tests.rs"

[dev-dependencies]
api_model.workspace = true
base64.workspace = true
console.workspace = true
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# Enabling `test-support` is what makes `FakeTransport` visible to this crate's tests:
# dev-dependencies unify features with the test build.
http_engine = { workspace = true, features = ["test-support"] }
secrets = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
settings.workspace = true
storage.workspace = true
tempfile.workspace = true
url.workspace = true
variables.workspace = true
workspace_store.workspace = true
