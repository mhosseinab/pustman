# crates/workspace_store/Cargo.toml
# The on-disk workspace format (PRD §6.1, ADR-0001): one deterministic JSON file per
# item, written atomically. Domain crate: no gpui, no UI — callers run it off the
# foreground thread.

[package]
name = "workspace_store"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/workspace_store.rs"

[dependencies]
api_model.workspace = true
notify.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
