# crates/secrets/Cargo.toml
[package]
name = "secrets"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/secrets.rs"

[features]
# Exposes `MemorySecretStore` to other crates' tests. keyring and thiserror publish no
# `test-support` feature of their own, so there is nothing to forward to.
test-support = []

[dependencies]
keyring.workspace = true
thiserror.workspace = true
