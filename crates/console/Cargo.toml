# crates/console — the Console's entries in memory: one per send, warning and cancel,
# held in a capped ring buffer (PRD §8.3). Nothing here is written to disk (REQ-CON-06).

[package]
name = "console"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/console.rs"

[dependencies]
api_model.workspace = true
gpui.workspace = true
http_engine.workspace = true
settings.workspace = true
url.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Enabling `test-support` is what makes `FakeTransport` and `MemorySecretStore` visible
# to this crate's tests: dev-dependencies unify features with the test build.
http_engine = { workspace = true, features = ["test-support"] }
secrets = { workspace = true, features = ["test-support"] }
variables.workspace = true
