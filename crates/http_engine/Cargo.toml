# `http_engine` — sending requests through a Transport, the PRD §8.6 error taxonomy and
# send/cancel (PRD §5.1, REQ-HTTP-12). The GPUI entity that owns an in-flight send lives
# here; `ReqwestTransport` is the tokio-backed transport that reaches a real server.

[package]
name = "http_engine"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/http_engine.rs"

[features]
# Exposes `FakeTransport` and `TestServer` to other crates' tests; compiled into this
# crate's own tests through `cfg(test)`.
test-support = [
    "dep:bytes",
    "dep:http-body-util",
    "dep:rcgen",
    "dep:tokio-rustls",
]

[dependencies]
# `cookie_persistence` returns `anyhow::Result`: its failures span `storage` and
# serialization, which no error type in this crate names.
anyhow.workspace = true
api_model.workspace = true
base64.workspace = true
# The RFC 6265 cookie store behind the per-workspace cookie jar (REQ-HTTP-08).
cookie_store.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
# `http2` so the request's HTTP version setting can force HTTP/2; `hyper` and `rustls`
# name the errors the transport classifies (reqwest has no `is_tls()` of its own).
# `hyper-util`'s `HttpInfo` is what `Response::remote_addr` is read from, and the only
# place a local socket address is reported (REQ-NET-02); `tokio` gives the test server
# its `TokioIo` adapter.
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "tokio"] }
# A failed history write logs one fixed message and nothing else: the error text behind
# it can quote the row it failed on (PRD §7, REQ-HIST-01).
log.workspace = true
# The Mozilla Public Suffix List parser behind the cookie jar's public-suffix rejection
# (RFC 6265 §5.3 step 5); the same `publicsuffix::List` type cookie_store takes.
publicsuffix.workspace = true
reqwest = { workspace = true, features = ["http2"] }
rustls.workspace = true
secrets.workspace = true
serde_json.workspace = true
# Cookies are local state (REQ-WSP-06): `cookie_persistence` loads and saves the jar
# through `storage`'s `cookies` table, on a background task.
storage.workspace = true
# `tempfile` owns the spill temp file: 0600 in the OS temp dir, removed on drop
# (REQ-RESP-06, REQ-NFR-03) — never hand-rolled temp naming or removal.
tempfile.workspace = true
thiserror.workspace = true
# Cookie expiry is a wall-clock time (REQ-HTTP-08), as in `storage`.
time.workspace = true
# `fs` is how the spawned tokio task writes the spilled tail of a response body.
tokio = { workspace = true, features = ["fs"] }
url.workspace = true
variables.workspace = true

# M3 auth helpers: Digest (`http-auth`), AWS Signature v4, HMAC/SHA-256 signing, JWT
# bearer tokens, and PFX client certificates converted to the PEM reqwest's rustls takes.
# SOCKS proxies come from the root reqwest line's `socks` feature.
aws-credential-types.workspace = true
aws-sigv4.workspace = true
hmac.workspace = true
http-auth.workspace = true
jsonwebtoken.workspace = true
p12-keystore.workspace = true
sha2.workspace = true

# The loopback test server: tokio + hyper over `hyper-util`'s IO adapter, plus `rcgen`
# for its self-signed TLS variant. Only compiled behind `test-support`.
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Enabling our own `test-support` feature is what makes `TestServer` visible to this
# crate's integration tests: dev-dependencies unify features with the test build.
http_engine = { path = ".", features = ["test-support"] }
# `MemorySecretStore` for the secret-lookup tests of `prepare`.
secrets = { workspace = true, features = ["test-support"] }
# The tampered-row cookie tests write a row `storage`'s API cannot express — an
# `attributes_json` that is not JSON at all — as raw SQL over a second connection to the
# same database file (`storage` exposes no raw-SQL handle).
rusqlite.workspace = true
